name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：填写则额外发 GitHub Release（如 v0.1.0）；留空则与 main 推送相同——只构建并上传 Artifact"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build .app
        run: |
          export PYTHON="$(command -v python)"
          bash packaging/build_macos.sh

      # 上传 .app 目录本身：Actions「下载 Artifact」只会再 zip 一次，避免 zip 套 zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: albn-autofish-macos-arm64
          path: dist/albn-autofish.app
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build onedir
        shell: bash
        run: |
          export PYTHON="$(command -v python)"
          bash packaging/build_windows.sh

      # 上传 onedir 目录：下载 Artifact 解压后即是 albn-autofish/，无 zip 套 zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: albn-autofish-windows-x64
          path: dist/albn-autofish
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    # main / 手动且 tag 留空：只构建；发版仅 push tag 或手动填了 tag
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Pack release zips
        run: |
          set -euo pipefail
          mkdir -p out
          # macOS：artifact 根下是 .app
          MAC_APP="$(find release-assets/albn-autofish-macos-arm64 -maxdepth 2 -name 'albn-autofish.app' -type d | head -n1)"
          if [[ -z "$MAC_APP" ]]; then
            echo "找不到 albn-autofish.app"; find release-assets -maxdepth 3 -print; exit 1
          fi
          (cd "$(dirname "$MAC_APP")" && zip -qry "$GITHUB_WORKSPACE/out/albn-autofish-macos-arm64.zip" "$(basename "$MAC_APP")")

          # Windows：artifact 可能是 albn-autofish/ 或扁平内容
          WIN_ROOT="release-assets/albn-autofish-windows-x64"
          if [[ -d "$WIN_ROOT/albn-autofish" ]]; then
            (cd "$WIN_ROOT" && zip -qry "$GITHUB_WORKSPACE/out/albn-autofish-windows-x64.zip" albn-autofish)
          elif [[ -f "$WIN_ROOT/albn-autofish.exe" ]]; then
            mkdir -p /tmp/winpack
            cp -a "$WIN_ROOT" /tmp/winpack/albn-autofish
            (cd /tmp/winpack && zip -qry "$GITHUB_WORKSPACE/out/albn-autofish-windows-x64.zip" albn-autofish)
          else
            echo "找不到 Windows 构建产物"; find release-assets -maxdepth 3 -print; exit 1
          fi
          ls -lah out/

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            out/albn-autofish-macos-arm64.zip
            out/albn-autofish-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
