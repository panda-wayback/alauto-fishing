name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：填写则额外发 GitHub Release（如 v0.1.0）；留空则与 main 推送相同——只构建并上传 Artifact"
        required: false
        default: ""
      expire_days:
        description: "试用天数（如 30=构建日起 30 天后过期）；留空=不过期"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    outputs:
      suffix: ${{ steps.build.outputs.suffix }}
      app_name: ${{ steps.build.outputs.app_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build .app
        id: build
        run: |
          export PYTHON="$(command -v python)"
          export ALBN_BUILD_SUFFIX="${GITHUB_RUN_ID}"
          export ALBN_EXPIRE_DAYS="${{ github.event.inputs.expire_days }}"
          bash packaging/build_macos.sh
          echo "suffix=${ALBN_BUILD_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "app_name=albn-autofish-${ALBN_BUILD_SUFFIX}.app" >> "$GITHUB_OUTPUT"

      # 上传 .app：Artifact 名带 run_id，避免同名冲突
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: albn-autofish-macos-arm64-${{ steps.build.outputs.suffix }}
          path: dist/${{ steps.build.outputs.app_name }}
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      suffix: ${{ steps.build.outputs.suffix }}
      dist_name: ${{ steps.build.outputs.dist_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build onedir
        id: build
        shell: bash
        run: |
          export PYTHON="$(command -v python)"
          export ALBN_BUILD_SUFFIX="${GITHUB_RUN_ID}"
          export ALBN_EXPIRE_DAYS="${{ github.event.inputs.expire_days }}"
          bash packaging/build_windows.sh
          echo "suffix=${ALBN_BUILD_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "dist_name=albn-autofish-${ALBN_BUILD_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: albn-autofish-windows-x64-${{ steps.build.outputs.suffix }}
          path: dist/${{ steps.build.outputs.dist_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    # main / 手动且 tag 留空：只构建；发版仅 push tag 或手动填了 tag
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack release zips
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p out
          # macOS：找带后缀的 .app，打进稳定名 albn-autofish.app
          MAC_APP="$(find release-assets -maxdepth 3 -name 'albn-autofish-*.app' -type d | head -n1)"
          if [[ -z "$MAC_APP" ]]; then
            echo "找不到 albn-autofish-*.app"; find release-assets -maxdepth 3 -print; exit 1
          fi
          MAC_STAGE="$(mktemp -d)"
          cp -a "$MAC_APP" "$MAC_STAGE/albn-autofish.app"
          (cd "$MAC_STAGE" && zip -qry "$GITHUB_WORKSPACE/out/albn-autofish-macos-arm64-${TAG}.zip" albn-autofish.app)

          # Windows：找带后缀目录，打进稳定名 albn-autofish/
          WIN_DIR="$(find release-assets -maxdepth 2 -type d -name 'albn-autofish-*' ! -name '*.app' | head -n1)"
          if [[ -z "$WIN_DIR" ]] || [[ ! -f "$WIN_DIR/albn-autofish.exe" ]]; then
            # artifact 根可能已是解压后的目录内容
            WIN_CAND="$(find release-assets -maxdepth 3 -name 'albn-autofish.exe' -type f | head -n1)"
            if [[ -n "$WIN_CAND" ]]; then
              WIN_DIR="$(dirname "$WIN_CAND")"
            fi
          fi
          if [[ -z "${WIN_DIR:-}" ]] || [[ ! -f "$WIN_DIR/albn-autofish.exe" ]]; then
            echo "找不到 Windows 构建产物"; find release-assets -maxdepth 4 -print; exit 1
          fi
          WIN_STAGE="$(mktemp -d)"
          mkdir -p "$WIN_STAGE/albn-autofish"
          cp -a "$WIN_DIR"/. "$WIN_STAGE/albn-autofish/"
          (cd "$WIN_STAGE" && zip -qry "$GITHUB_WORKSPACE/out/albn-autofish-windows-x64-${TAG}.zip" albn-autofish)
          ls -lah out/

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            out/albn-autofish-macos-arm64-${{ steps.meta.outputs.tag }}.zip
            out/albn-autofish-windows-x64-${{ steps.meta.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
