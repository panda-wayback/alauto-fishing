name: detect
function: 从帧识别绿条与鱼漂并发布读数
modules: []
input:
  # ---- 统一识别入口（autofish.detect）----
  - name: autofish.detect.detect(rgb)
    type: "rgb: np.ndarray uint8 (H, W, 3) RGB；任意尺寸"
    desc: 用进程内当前识别器（get_detector()）识别一帧：找漂、定条（或用已锁/手动条界）、算 pos
  - name: autofish.detect.apply_manual_bar(box)
    type: "box: tuple[float, float, float, float] (left, top, width, height) 帧像素坐标 | None"
    desc: 给当前识别器注入手动条界；None 清除手动条界
  - name: autofish.detect.get_detector()
    type: 无参
    desc: 取进程内当前识别器（首次调用时创建）
  # ---- 锚漂识别器（autofish.detect.BobberAnchorDetector）----
  - name: autofish.detect.BobberAnchorDetector(bobber_path=None, endcap_left_path=None, endcap_right_path=None, *, endcap_min_score=0.42, endcap_min_orange=0.12, find_bobber=None)
    type: "*_path: str | pathlib.Path | None（None 用 assets/bobber_anchor/ 下默认漂图与端帽）; endcap_min_*: float; find_bobber: FindBobber | None（None 内部新建）"
    desc: 新建一个独立的锚漂识别器（先漂后条），与 get_detector() 的单例互不影响
  - name: BobberAnchorDetector.detect(rgb)
    type: "rgb: np.ndarray uint8 (H, W, 3) RGB"
    desc: 识别一帧，语义同 autofish.detect.detect
  - name: BobberAnchorDetector.set_manual_bar(box)
    type: "box: (left, top, width, height) | None"
    desc: 设置 / 清除手动条界
  - name: BobberAnchorDetector.clear_bar_lock()
    type: 无参
    desc: 丢弃程序自动锁定的条界、跟漂点与漂尺度锁档（ROI 变更 / 重框时调用）；不清手动条界
  # ---- 独立找漂（autofish.detect.FindBobber）----
  - name: autofish.detect.FindBobber(bobber_path=None, *, min_score=0.48, accept_min_score=0.55, accept_min_rank=0.55, accept_min_cream=0.05, accept_min_band=0.20, accept_min_plume=0.04, accept_min_margin=0.04, accept_solo_score=0.68)
    type: "bobber_path: str | pathlib.Path | None（None 用 assets/bobber_anchor/bobber.png）; 其余为接受门槛 float，默认值即基线配置"
    desc: 新建找漂器（只定漂，不定条、不算 pos）
  - name: FindBobber.find(rgb, *, search_box=None, scale_hint=None)
    type: "rgb: np.ndarray uint8 (H, W, 3) RGB; search_box: (left, top, width, height) 入图像素 | None（None=整图去边）; scale_hint: float | None（漂相对模板的尺度提示）"
    desc: 找一个足够确信的漂
  - name: FindBobber.find_candidates(rgb, *, max_n=5, search_box=None, scale_hint=None)
    type: "同 find；max_n: int"
    desc: 列出漂候选（不经接受门槛）
  - name: FindBobber.lock_scale(scale) / FindBobber.clear_locked_scale()
    type: "scale: float | None（None 或 ≤0 等同清除）"
    desc: 固定 / 清除后续复核优先使用的尺度档
  # ---- 识别工人（autofish.detect.DetectorWorker）----
  - name: autofish.detect.DetectorWorker(bus)
    type: "bus: autofish.events.bus.AutofishBus"
    desc: 新建识别工人
  - name: DetectorWorker.start() / DetectorWorker.stop(timeout=2.0) / DetectorWorker.is_running()
    type: "无参 / timeout: float 秒 / 无参"
    desc: start 订阅 Topic.FRAME 并起后台线程；stop 退订并等待线程结束；is_running 查询线程是否存活
  - name: 订阅 Topic.FRAME
    type: "autofish.events.topics.FrameEvent(frame: (H, W, 3) uint8 RGB, roi_version, ts, seq)"
    desc: 工人运行期间接收的帧
  # ---- 辅助（autofish.detect.bobber）----
  - name: autofish.detect.bobber.pixel_to_pos(x, width)
    type: "x: float（条内像素偏移）; width: int（条宽像素）"
    desc: 条内像素位置换算成 0～100
  - name: autofish.detect.bobber.green_zone_mask(rgb)
    type: "rgb: np.ndarray uint8 (H, W, 3) RGB"
    desc: 计算绿区掩膜（预览叠层用）
  # ---- CLI ----
  - name: python -m autofish.detect.check_find_bobber_baseline
    type: "无参数；读 <资源根>/data/test/find_bobber_baseline.json 及同目录图片（资源根=common.paths.bundle_root()）"
    desc: 用 FindBobber 逐图对照定漂基线
output:
  - name: detect(rgb) / BobberAnchorDetector.detect(rgb)
    type: "autofish.detect.BobberHit | None"
    desc: "三种结果：全量命中（bar_width>0，pos 有效）；仅漂命中（有漂无条：bar_left/top/width/height 全为 0、pos=0.0 无意义）；None（无足够确信的漂，或有条界时漂不在条内）"
  - name: autofish.detect.BobberHit
    type: "frozen dataclass（即 autofish.events.topics.BobberHit，autofish.detect / autofish.detect.bobber 重新导出）：pos: float 0～100; x, y: float 漂心; pixel_count: int 漂框面积（原图像素）; bar_left, bar_top, bar_width, bar_height: float 条框; score: float 漂模板分; detect_ms: float 本帧耗时毫秒"
    desc: 识别结果；所有坐标均为调用方入图的原图像素
  - name: get_detector()
    type: "BobberAnchorDetector（满足 autofish.detect.BarDetector 协议：name: str, detect(rgb)）"
    desc: 进程内单例；name == "bobber_anchor"
  - name: BobberAnchorDetector.program_bar / manual_bar / bar_locked
    type: "program_bar, manual_bar: (left, top, width, height) | None; bar_locked: bool"
    desc: program_bar=程序自动锁定的条界（原图像素）；manual_bar=当前手动条界；bar_locked=任一存在
  - name: FindBobber.find(...)
    type: "autofish.detect.BobberLoc | None"
    desc: "BobberLoc(frozen)：x, y: float 漂心; left, top, width, height: int 漂包围盒; score: float 彩色模板分; rank: float; cream, band, plume: float 结构分; detect_ms: float；body_height 属性: int。坐标为入图原图像素"
  - name: FindBobber.find_candidates(...)
    type: "list[BobberLoc]（≤ max_n）"
    desc: 按 rank 降序；无候选为 []
  - name: 发布 Topic.POS（经 AutofishBus.publish_pos）
    type: "autofish.events.topics.PosEvent(pos, hit, roi_version, frame_ts, ts, frame_seq, frame, detect_ms)"
    desc: "每识别完一帧发一条：hit=识别结果；pos=hit.pos（仅全量命中时），否则 None；roi_version / frame_ts / frame_seq / frame 取自对应 FrameEvent；detect_ms=识别耗时（异常帧为 0）"
  - name: pixel_to_pos(x, width)
    type: float
    desc: "100 × x / (width − 1)，夹到 [0, 100]；width ≤ 1 时为 0.0"
  - name: green_zone_mask(rgb)
    type: "np.ndarray uint8 (H, W)，值 0 / 255"
    desc: 255=亮绿安全区像素
  - name: check_find_bobber_baseline 退出码与 stdout
    type: "int：0 全部通过；1 有回归；2 缺基线文件"
    desc: 逐图打印 [OK] / [FAIL]；HIT 用例按基线 tolerance（center_px / box_px / score_min_delta）比对，MISS 用例要求无命中
contract:
  - 漂判定宁可 miss 不可错：空白、纯色、噪声图及无漂画面返回 None；非 (H, W, 3) 输入返回 None（FindBobber 返回 None / []）
  - 在 data/test/find_bobber_baseline.json 的基线图上，FindBobber 结果在基线 tolerance 内；detect 的漂心同样在 center_px 内，并给出含漂的绿条
  - 全量命中时 bar_left < x < bar_left + bar_width，pos ∈ [0, 100] 且 ≈ 100 × (x − bar_left) / bar_width
  - 入图超出 800×800 时等比缩小后识别，输出坐标、条框、pixel_count 面积、BobberLoc 均映回原图像素；已在限内不缩放、不放大
  - 条界来源优先级：手动条界 > 程序锁定 > 未锁定时由漂两侧端帽自动定界（成功即写入程序锁）
  - 有手动条界或程序锁时只在条带邻域（底贴条底、仅向上留羽冠余量）内找漂，不再自动定界；漂不在条 X / Y 容差内时本帧为 None 或仅漂命中
  - 程序锁与手动条界在 miss 时不自动清除；程序锁只由 clear_bar_lock 清除，手动条界只由 apply_manual_bar(None) / set_manual_bar(None) 清除
  - 条已锁定但丢漂后，恢复搜索隔帧进行（丢漂期间约一半帧不搜索直接 None）
  - 未锁条且自动定界失败时返回仅漂命中（不假装有条），且不写入程序锁
  - get_detector() / detect / apply_manual_bar 共享同一进程内有状态单例，非线程安全；独立实例请用 BobberAnchorDetector(...)
  - FindBobber 首次命中后锁定该尺度档供后续帧优先使用；有 search_box 时只在该区域内找漂
  - DetectorWorker 只认最新帧：识别期间积压的帧只保留最新一帧，其余抛弃不识；已开始识别的帧识别完仍发布 Pos
  - DetectorWorker 忽略 seq 不大于上次已识别帧的帧；每次 start 重置帧序
  - DetectorWorker 单帧识别抛异常不退出线程，该帧以 pos=None、hit=None、detect_ms=0 发布
  - DetectorWorker 收到与上一帧 roi_version 不同的帧时先对当前识别器 clear_bar_lock；start 后第一帧只对齐版本、不清锁（监控开关保留程序锁）
  - DetectorWorker 不发布、不修改 ROI；stop 后不再响应 Frame
  - 性能目标：条锁定后单帧识别 < 50 ms（整段 ≥ 20 fps），FindBobber 单帧 < 100 ms
depends:
  - src/autofish/events
  - src/common
errors:
  - code: FileNotFoundError
    desc: FindBobber / BobberAnchorDetector 构造（含 get_detector、detect 首次调用）时漂模板或端帽资源不存在或不可读
  - code: ValueError
    desc: green_zone_mask 输入不是 (H, W, 3)
tests:
  - detect 在每张基线图上漂心符合基线，并给出含漂的绿条与一致的 pos
  - 空白、纯色、噪声与非 3 通道输入 detect 返回 None
  - 放大 2 倍的大图识别结果映回原图坐标（约为原结果 2 倍）
  - 只含漂不含条端的裁剪图返回仅漂命中且不写入程序锁
  - 全量命中后写入程序锁；clear_bar_lock 后程序锁清空
  - 程序锁定后 miss 帧返回 None 且不清锁
  - apply_manual_bar 注入手动条界后结果的条框等于手动界、pos 按手动界重算
  - 手动条界远离漂时无读数且不自动定界
  - apply_manual_bar(None) 清除手动界后恢复自动条界
  - get_detector 返回同一个 bobber_anchor 单例；BobberHit 即 events 的 BobberHit
  - 资源路径不存在时 FindBobber / BobberAnchorDetector 构造抛 FileNotFoundError
  - pixel_to_pos 端点、夹取与 width≤1
  - green_zone_mask 输出 0/255 掩膜、绿为 255 其它为 0，非 3 通道抛 ValueError
  - FindBobber 空白与非 3 通道输入返回 None / []
  - FindBobber 在条带搜区内命中、搜区远离漂时 None
  - FindBobber.find_candidates 按 rank 降序且不超过 max_n
  - FindBobber 清除 / 设置锁档后同图结果不变
  - FindBobber 放大 2 倍大图命中坐标映回原图
  - check_find_bobber_baseline CLI 在仓库基线上退出码 0
  - check_find_bobber_baseline 缺基线退出 2；期望 HIT 却 miss 退出 1；期望 MISS 且无漂退出 0
  - DetectorWorker 收帧后发布对应 Pos（全量命中带 pos，帧序 / 版本 / 帧对象对齐）
  - DetectorWorker 仅漂命中时 pos=None 而 hit 保留；无漂时 pos 与 hit 均为 None
  - DetectorWorker 识别期间积压帧只识别最新一帧，已开算帧仍发布
  - DetectorWorker 忽略不大于已识别帧序的帧；重启后帧序重置
  - DetectorWorker 单帧异常不退出线程，后续帧照常发布
  - DetectorWorker ROI 版本变化时清条锁，启动后首帧不清
  - DetectorWorker stop 后不再发布 Pos
