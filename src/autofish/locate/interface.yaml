name: locate
function: 手框 ROI 与手动条界的存盘读写
modules: []
input:
  # ---- ROI 值对象 ----
  - name: autofish.locate.Roi(left, top, width, height)
    type: "left, top, width, height: int（逻辑点；屏幕虚拟桌面坐标）"
    desc: 构造不可变手框；left/top 可为负（虚拟桌面原点左/上方的显示器）
  - name: Roi.as_mss()
    type: 无参
    desc: 转成 mss 截图范围字典
  - name: autofish.locate.default_center_roi(screen_w, screen_h)
    type: "screen_w, screen_h: int（主屏逻辑宽高，> 0）"
    desc: 计算主屏居中、宽高各约 1/4 的默认手框
  - name: autofish.locate.primary_screen_size()
    type: 无参
    desc: 读主屏逻辑宽高（经 mss）
  # ---- 条界值对象 ----
  - name: autofish.locate.BarMark(left, right, top=0.0, height=0.0, frame_width=0.0)
    type: "全部 float，Frame 像素坐标；frame_width 为标定时帧宽，0 表示按 ROI 逻辑宽"
    desc: 构造不可变手动条界
  - name: BarMark.width
    type: 属性
    desc: 条宽 right - left
  - name: BarMark.as_box()
    type: 无参
    desc: 取标定坐标系下的条框
  - name: BarMark.box_for_frame(frame_width, roi_width)
    type: "frame_width: float（当前帧宽）; roi_width: float（当前 ROI 逻辑宽）"
    desc: 取按当前帧宽换算后的条框
  # ---- 存盘 ----
  - name: autofish.locate.DEFAULT_ROI_PATH
    type: "pathlib.Path 常量 = common.paths.data_root() / \"roi.json\""
    desc: 默认 ROI 存盘文件；下列函数 path=None 时使用
  - name: autofish.locate.ROI_SOURCE_MANUAL / autofish.locate.ROI_SOURCE_DEFAULT
    type: "str 常量 \"manual\" / \"default\""
    desc: ROI 存盘来源取值
  - name: autofish.locate.save_roi(roi, path=None, *, bar=None, keep_bar=False, source=None)
    type: "roi: Roi; path: Path | None; bar: BarMark | None; keep_bar: bool; source: \"manual\" | \"default\" | None"
    desc: 写 ROI 存盘（JSON），可同时写入 / 保留手动条界与来源
  - name: autofish.locate.load_roi(path=None)
    type: "path: Path | None"
    desc: 读 ROI 存盘
  - name: autofish.locate.load_roi_source(path=None)
    type: "path: Path | None"
    desc: 读 ROI 存盘来源
  - name: autofish.locate.load_bar_mark(path=None)
    type: "path: Path | None（ROI 存盘文件）"
    desc: 读与 ROI 同档的手动条界
  - name: autofish.locate.clear_bar_mark(path=None)
    type: "path: Path | None（ROI 存盘文件）"
    desc: 从 ROI 存盘中删去手动条界
  - name: autofish.locate.bar_ref_path(roi_path=None)
    type: "roi_path: Path | None"
    desc: 取条界参考图路径
  - name: autofish.locate.clear_bar_ref(roi_path=None)
    type: "roi_path: Path | None"
    desc: 删除条界参考图
output:
  - name: Roi.as_mss()
    type: "dict {left, top, width, height: int}"
    desc: 与构造参数一致
  - name: autofish.locate.default_center_roi(screen_w, screen_h)
    type: Roi
    desc: "width = min(screen_w, max(32, round(screen_w/4)))，height 同理；left = (screen_w - width)//2，top = (screen_h - height)//2"
  - name: autofish.locate.primary_screen_size()
    type: "tuple[int, int] (width, height)"
    desc: mss 主屏 monitors[1] 的宽高；只有一项时取 monitors[0]
  - name: BarMark.as_box()
    type: "tuple[float, float, float, float] (left, top, width, height)"
    desc: height 为 0 时返回 1.0
  - name: BarMark.box_for_frame(frame_width, roi_width)
    type: "tuple[float, float, float, float] (left, top, width, height)"
    desc: as_box() 各项乘 k；k = frame_width / 基准宽，基准宽 = BarMark.frame_width（>0）否则 roi_width；基准宽 ≤ 0 时 k = 1
  - name: autofish.locate.save_roi(...)
    type: pathlib.Path
    desc: 实际写入的文件路径
  - name: autofish.locate.load_roi(path=None)
    type: Roi
    desc: 存盘中的手框
  - name: autofish.locate.load_roi_source(path=None)
    type: "\"manual\" | \"default\""
    desc: 存盘来源
  - name: autofish.locate.load_bar_mark(path=None)
    type: "BarMark | None"
    desc: 存盘中的手动条界；无则 None
  - name: autofish.locate.bar_ref_path(roi_path=None)
    type: pathlib.Path
    desc: roi_path 为 None 或等于 DEFAULT_ROI_PATH 时为 data_root()/bar_ref.png；否则为 roi_path 同目录下的 bar_ref.png
contract:
  - 本 Module 不截屏（primary_screen_size 只读显示器尺寸）、不识图、不点鼠标、不发布总线事件
  - Roi / BarMark 为不可变值对象（frozen dataclass），可作字典键与跨线程共享
  - Roi 的 width / height 必须 > 0；left / top 允许为负
  - BarMark 要求 right - left ≥ 8 且 height ≥ 0
  - save_roi 自动创建父目录；返回值即写入路径；save 后 load_roi 读回相等的 Roi
  - save_roi 的 source 为 None 时沿用文件中已有来源（文件不存在则 manual）；"default" 写 default；其它任何值写 manual
  - save_roi 默认（bar=None 且 keep_bar=False）清掉文件中已有手动条界；keep_bar=True 保留已有条界；显式 bar 优先于 keep_bar
  - save_roi 不删除条界参考图；重框 / 恢复默认时调用方须另调 clear_bar_ref
  - load_roi_source：文件不存在 → default；文件不是合法 JSON → manual；缺 source 字段或未知取值 → manual（大小写与首尾空白不敏感）
  - load_bar_mark：文件不存在、无条界字段或条界非法（宽 < 8）时返回 None，不抛
  - BarMark.frame_width 仅在 > 0 时写入存盘；读回缺省为 0
  - clear_bar_mark 只删条界字段，ROI 与来源保持不变；文件不存在时静默
  - clear_bar_ref 只在参考图存在时删除；不存在时静默
  - 所有存盘函数 path=None 时使用 DEFAULT_ROI_PATH（导入时按 data_root() 定值）
depends:
  - src/common
errors:
  - code: ValueError
    desc: Roi 宽或高 ≤ 0；BarMark 宽 < 8 或 height < 0；default_center_roi 屏幕宽或高 ≤ 0
  - code: FileNotFoundError
    desc: load_roi 的存盘文件不存在
  - code: json.JSONDecodeError / KeyError
    desc: load_roi 的存盘不是合法 JSON 或缺 left/top/width/height 字段；load_bar_mark / clear_bar_mark 遇非法 JSON 抛 JSONDecodeError
  - code: ImportError
    desc: primary_screen_size 时未安装 mss
tests:
  - Roi.as_mss 返回与构造参数相同的字典，允许负坐标
  - Roi 宽或高 ≤ 0 抛 ValueError，且实例不可修改
  - default_center_roi 返回居中 1/4 框；小屏下限 32 且不超过屏幕；非正尺寸抛 ValueError
  - primary_screen_size 取 mss monitors[1]，只有一项时取 monitors[0]
  - BarMark 宽 < 8 或 height < 0 抛 ValueError；width 与 as_box（高 0 记 1）正确
  - BarMark.box_for_frame 按标定帧宽换算；无标定帧宽时按 ROI 逻辑宽换算
  - save_roi 创建父目录并返回路径，load_roi 读回相等 Roi；缺文件 load_roi 抛 FileNotFoundError
  - save_roi 的 source 写入与沿用规则；load_roi_source 对缺文件 / 坏 JSON / 缺字段 / 未知值的返回
  - save_roi 默认清条界，keep_bar 保留条界，显式 bar 覆盖；frame_width 读回一致
  - load_bar_mark 对缺文件、无条界、非法条界返回 None
  - clear_bar_mark 只删条界保留 ROI 与来源；缺文件静默
  - bar_ref_path 对自定义路径取同目录 bar_ref.png，对默认路径取 data_root()/bar_ref.png；clear_bar_ref 删除存在的参考图、缺失时静默
  - path=None 时各存盘函数读写 DEFAULT_ROI_PATH（测试中替换为临时路径）
