<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  .wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
  }
  .logo {
    width: 120px;
    height: 120px;
    object-fit: contain;
  }
  h1 {
    margin: 0;
    font-size: 84px;
  }
  p {
    margin: 0;
    font-size: 34px;
    color: var(--muted);
    max-width: 1100px;
    line-height: 1.4;
  }
  .ctas {
    display: flex;
    gap: 20px;
    margin-top: 20px;
  }
  .btn {
    padding: 18px 36px;
    border-radius: 14px;
    font-size: 28px;
    font-weight: 700;
  }
  .btn.primary {
    background: var(--accent);
    color: #132010;
  }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 2px solid rgba(242, 239, 230, 0.35);
  }
  .cmd {
    margin-top: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 26px;
    padding: 14px 28px;
    border-radius: 12px;
    background: #121610;
    border: 1px solid rgba(255,255,255,0.08);
    color: #c8d4b8;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="wrap" id="wrap">
    <img class="logo" id="logo" src="assets/logo.png" alt="">
    <h1 class="brand" id="title">开始拉鱼</h1>
    <p id="sub">本地模拟器测策略 · 真机调试壳自动拉 · MIT 开源</p>
    <div class="ctas" id="ctas">
      <span class="btn primary" id="b1">安装 · INSTALL.md</span>
      <span class="btn ghost" id="b2">开源仓库</span>
    </div>
    <div class="cmd" id="cmd">make sim &nbsp;·&nbsp; make preview</div>
  </div>
</div>
<script type="module">
const wrap = document.getElementById("wrap");
const logo = document.getElementById("logo");
const title = document.getElementById("title");
const sub = document.getElementById("sub");
const ctas = document.getElementById("ctas");
const cmd = document.getElementById("cmd");

function ease(t) {
  return 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
}

window.film = {
  duration: 8,
  ready: Promise.all([
    logo.decode?.() ?? Promise.resolve(),
    document.fonts.ready,
  ]),
  frame(t) {
    const a = ease(t / 0.55);
    const b = ease((t - 0.2) / 0.55);
    const c = ease((t - 0.4) / 0.55);
    const d = ease((t - 0.65) / 0.55);
    const e = ease((t - 0.9) / 0.55);
    logo.style.opacity = String(a);
    logo.style.transform = `scale(${0.9 + 0.1 * a})`;
    title.style.opacity = String(b);
    title.style.transform = `translateY(${(1 - b) * 18}px)`;
    sub.style.opacity = String(c);
    ctas.style.opacity = String(d);
    cmd.style.opacity = String(e);
    const pulse = t > 4 ? 1 + 0.01 * Math.sin((t - 4) * 3) : 1;
    wrap.style.transform = `scale(${pulse})`;
  },
};
</script>
</body>
</html>
